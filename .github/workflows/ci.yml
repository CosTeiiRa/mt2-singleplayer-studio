name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: python tools/check_project.py
      - run: >-
          python -m pip install --only-binary=:all: -r config/requirements-addons.txt --target .vendor
        if: matrix.python != '3.10'
      - run: python -m unittest discover -s tests -t . -v
      - run: node --test tests/apply_status.test.js tests/history.test.js tests/catalog.test.js tests/catalogue_sync.test.js tests/icons.test.js tests/item_explorer.test.js tests/navigation.test.js tests/quest_help.test.js tests/update_priority.test.js tests/addons.test.mjs tests/addons_view.test.mjs tests/addon_jobs.test.mjs
      - name: Validate Windows launchers
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Get-ChildItem -Path scripts/windows -Filter *.ps1 | ForEach-Object {
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors)
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
      - run: python tools/build_release.py
